services:
  - type: static
    name: ipe-grind
    branch: prod
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
